<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مافيا الأمراء | 𝔞𝔩 𝔭𝔯𝔧𝔫𝔠𝔢𝔰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #181818 0%, #080808 70%, #000000 100%);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            position: relative;
        }

        /* العلامة المائية الخلفية للمافيا */
        .mafia-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-12deg);
            font-size: 18vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            letter-spacing: 15px;
            pointer-events: none;
            z-index: 1;
        }

        /* العنوان العلوي المزخرف */
        .header-section {
            text-align: center;
            margin-top: 5px;
            z-index: 10;
        }

        .header-title {
            font-size: 26px;
            font-weight: bold;
            color: #d4af37;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.4), 0 2px 4px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* بادج المقاعد المتبقية */
        .seats-badge {
            display: inline-block;
            margin-top: 6px;
            font-size: 13px;
            padding: 3px 12px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            color: #f3e5ab;
            letter-spacing: 1px;
        }

        /* النص الإرشادي فوق الصورة */
        .click-hint {
            font-size: 15px;
            color: #d4af37;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            opacity: 0.9;
            z-index: 10;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        /* حاوية الصورة وتكنيك القلب السلس */
        .card-container {
            width: 90%;
            max-width: 480px;
            height: 270px;
            perspective: 1000px;
            cursor: pointer;
            z-index: 5;
            margin: auto 0;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.3);
            background-color: #111;
        }

        .card-front img, .card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* شريط الأزرار السفلي */
        .button-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            z-index: 10;
            width: 100%;
            max-width: 380px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            text-align: center;
        }

        .btn-green {
            background-color: #1b5e20;
            box-shadow: 0 4px 15px rgba(27, 94, 32, 0.5);
            border: 1px solid #2e7d32;
        }
        .btn-green:hover {
            background-color: #2e7d32;
            transform: translateY(-2px);
        }

        .btn-red {
            background-color: #8b0000;
            box-shadow: 0 4px 15px rgba(139, 0, 0, 0.5);
            border: 1px solid #b71c1c;
        }
        .btn-red:hover {
            background-color: #a71d1d;
            transform: translateY(-2px);
        }

        /* النوافذ المنبثقة */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-card {
            background: #111111;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 22px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        .modal-card h3 {
            margin-bottom: 18px;
            font-size: 18px;
            color: #d4af37;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #bbb;
        }

        .form-group input {
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #1c1c1c;
            color: #fff;
            font-size: 15px;
            outline: none;
            direction: ltr;
            text-align: right;
        }

        .form-group input:focus {
            border-color: #d4af37;
        }

        /* شبكة أزرار الأرقام (1 إلى 10) */
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .num-btn {
            padding: 10px 0;
            background: #222;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .num-btn:hover:not(.locked) {
            border-color: #d4af37;
            color: #d4af37;
        }
        .num-btn.selected {
            background: #d4af37;
            color: #000;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        .num-btn.locked {
            background: #141414;
            border-color: #222;
            color: #555;
            cursor: not-allowed;
            text-decoration: line-through;
            opacity: 0.5;
        }

        .error-msg {
            color: #ff5252;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            text-align: center;
            background: rgba(255, 82, 82, 0.1);
            padding: 8px;
            border-radius: 4px;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .admin-link {
            position: fixed;
            bottom: 12px;
            left: 12px;
            font-size: 13px;
            color: #d4af37;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
        }
        .admin-link:hover {
            background: rgba(212, 175, 55, 0.2);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        .admin-table th, .admin-table td {
            border: 1px solid #2a2a2a;
            padding: 8px;
            text-align: center;
        }
        .admin-table th { background: #1c1c1c; color: #d4af37; }
        .btn-delete {
            background: #8b0000;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- العلامة المائية -->
    <div class="mafia-watermark">MAFIA</div>

    <!-- العنوان العلوي -->
    <div class="header-section">
        <div class="header-title">
            <span>🎩</span> مافيا الأمراء | 𝔞𝔩 𝔭𝔯𝔧𝔫𝔠𝔢𝔰 <span>🔫</span>
        </div>
        <div class="seats-badge" id="seatsBadge">جاري فحص المقاعد...</div>
    </div>

    <!-- نص التنبيه فوق الصورة -->
    <div class="click-hint">👈 اضغط على الصورة 👉</div>

    <!-- كرت الصورة القابل للقلب عند الضغط -->
    <div class="card-container" onclick="flipCard()">
        <div class="card-inner" id="cardInner">
            <div class="card-front">
                <img id="img1" src="/static/image1.png" 
                     onerror="tryAlternativeImage(this, ['/static/image1.jpg', '/static/image1.jpeg', '/static/image 1.png', '/static/image 1.jpg', '/static/image1'])" 
                     alt="واجهة المافيا">
            </div>
            <div class="card-back">
                <img id="img2" src="/static/image 2.png" 
                     onerror="tryAlternativeImage(this, ['/static/image 2.jpg', '/static/image 2.jpeg', '/static/image2.png', '/static/image2.jpg', '/static/image2'])" 
                     alt="تعليمات المافيا">
            </div>
        </div>
    </div>

    <!-- شريط الأزرار -->
    <div class="button-bar">
        <button class="btn btn-green" onclick="openConfirmModal()">المشاركة</button>
        <button class="btn btn-red" onclick="exitSite()">عدم المشاركة</button>
    </div>

    <!-- زر لوحة التحكم -->
    <div class="admin-link" onclick="openAdminLogin()">⚙️ لوحة التحكم</div>

    <!-- النافذة الأولى (تأكيد) -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-card">
            <h3>هل أنت متأكد من دخول عالم مافيا الأمراء؟</h3>
            <div class="modal-btns">
                <button class="btn btn-green" onclick="goToForm()">نعم</button>
                <button class="btn btn-red" onclick="closeConfirmModal()">لا</button>
            </div>
        </div>
    </div>

    <!-- نافذة استمارة التسجيل -->
    <div class="modal-overlay" id="formModal">
        <div class="modal-card">
            <h3>للمشاركة املأ الحقول التالية</h3>
            
            <div class="form-group">
                <label>الحقل الأول: الاسم الكامل</label>
                <input type="text" id="playerName" placeholder="أدخل اسمك هنا">
            </div>

            <div class="form-group">
                <label>الحقل الثاني: اختر رقمك (1 إلى 10)</label>
                <div class="numbers-grid" id="numbersGrid"></div>
                <input type="hidden" id="playerNumber" value="">
            </div>

            <div class="form-group">
                <label>الحقل الثالث: يوزر التليجرام</label>
                <input type="text" id="playerTelegram" placeholder="مثال: @username">
            </div>

            <div class="error-msg" id="formError"></div>

            <div class="modal-btns">
                <button class="btn btn-green" id="submitBtn" onclick="submitRegistration()">تأكيد الحجز</button>
                <button class="btn btn-red" style="background:#444;" onclick="closeFormModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة رسالة الشكر والإنهاء -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-card">
            <h3 style="color:#ffffff;">شكرا لمشاركتك انتضر الموعد المحدد من قبل @mgpka للعبه</h3>
            <div class="modal-btns" style="margin-top: 25px;">
                <button class="btn btn-red" style="width: 100%;" onclick="exitSite()">تم / الخروج</button>
            </div>
        </div>
    </div>

    <!-- نافذة تسجيل دخول الأدمن -->
    <div class="modal-overlay" id="adminLoginModal">
        <div class="modal-card">
            <h3>تسجيل دخول لوحة التحكم</h3>
            <div class="form-group">
                <label>الإيميل</label>
                <input type="email" id="adminEmail" placeholder="الإيميل">
            </div>
            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" id="adminPass" placeholder="كلمة السر">
            </div>
            <div class="error-msg" id="adminError"></div>
            <div class="modal-btns">
                <button class="btn btn-green" onclick="loginAdmin()">دخول</button>
                <button class="btn btn-red" style="background:#444;" onclick="closeAdminLogin()">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- نافذة عرض المشاركين للأدمن -->
    <div class="modal-overlay" id="adminDashboardModal">
        <div class="modal-card" style="max-width: 550px; max-height: 85vh; overflow-y: auto;">
            <h3>قائمة أعضاء المافيا المسجلين</h3>

            <div style="display:flex; gap:8px; margin-bottom:12px;">
                <button class="btn btn-green" style="font-size:13px; padding:8px;" onclick="copyListForTelegram()">📋 نسخ القائمة للتليجرام</button>
                <button class="btn btn-red" style="font-size:13px; padding:8px;" onclick="resetRound()">🔄 تصفير / جولة جديدة</button>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الرقم</th>
                        <th>التليجرام</th>
                        <th>حذف</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>
            <div style="margin-top: 15px;">
                <button class="btn btn-red" style="padding: 8px 15px; font-size: 14px; background:#444;" onclick="closeAdminDashboard()">إغلاق اللوحة</button>
            </div>
        </div>
    </div>

    <!-- مشغل موسيقى العراب The Godfather -->
    <iframe id="ytPlayer" 
            style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; left: -9999px;" 
            src="https://www.youtube.com/embed/AJgE_dLWsuQ?enablejsapi=1&autoplay=1&mute=1&loop=1&playlist=AJgE_dLWsuQ" 
            allow="autoplay">
    </iframe>

    <script>
        let currentParticipants = [];

        // 1. قلب الصورة
        function flipCard() {
            document.getElementById('cardInner').classList.toggle('flipped');
        }

        function tryAlternativeImage(imgElement, alternatives) {
            if (alternatives && alternatives.length > 0) {
                const nextSrc = alternatives.shift();
                imgElement.onerror = function() {
                    tryAlternativeImage(imgElement, alternatives);
                };
                imgElement.src = nextSrc;
            }
        }

        // 2. تشغيل موسيقى العراب
        let audioStarted = false;
        function startAudio() {
            if (!audioStarted) {
                const iframe = document.getElementById('ytPlayer');
                iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                audioStarted = true;
            }
        }
        window.addEventListener('click', startAudio);
        window.addEventListener('touchstart', startAudio);

        // 3. جلب حالة المقاعد من السيرفر
        async function fetchServerStatus() {
            try {
                const res = await fetch('/api/participants');
                currentParticipants = await res.json();
                
                const remaining = 10 - currentParticipants.length;
                const badge = document.getElementById('seatsBadge');
                if (remaining > 0) {
                    badge.innerText = `المقاعد المتبقية: ${remaining} من 10`;
                    badge.style.color = '#f3e5ab';
                } else {
                    badge.innerText = 'اكتملت المقاعد (10/10) - اللعبة ممتلئة';
                    badge.style.color = '#ff5252';
                }
            } catch(e) {}
        }
        fetchServerStatus();

        // 4. رسم أزرار الأرقام من 1 إلى 10
        function renderNumberButtons() {
            const grid = document.getElementById('numbersGrid');
            grid.innerHTML = '';
            document.getElementById('playerNumber').value = '';
            
            const reservedNumbers = currentParticipants.map(p => p.number);

            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'num-btn';
                btn.innerText = i;

                if (reservedNumbers.includes(i)) {
                    btn.classList.add('locked');
                    btn.title = 'محجوز';
                } else {
                    btn.onclick = function() {
                        document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        document.getElementById('playerNumber').value = i;
                    };
                }
                grid.appendChild(btn);
            }
        }

        function openConfirmModal() { document.getElementById('confirmModal').style.display = 'flex'; }
        function closeConfirmModal() { document.getElementById('confirmModal').style.display = 'none'; }
        
        async function goToForm() { 
            closeConfirmModal(); 
            await fetchServerStatus();
            renderNumberButtons();
            document.getElementById('formModal').style.display = 'flex'; 
        }

        function closeFormModal() {
            document.getElementById('formModal').style.display = 'none';
            document.getElementById('formError').style.display = 'none';
        }

        function exitSite() { window.location.href = "about:blank"; window.close(); }

        // 5. التسجيل وإرساله للسيرفر الموحد
        async function submitRegistration() {
            const name = document.getElementById('playerName').value.trim();
            const numberVal = document.getElementById('playerNumber').value;
            const telegram = document.getElementById('playerTelegram').value.trim();
            const errorDiv = document.getElementById('formError');
            const submitBtn = document.getElementById('submitBtn');

            errorDiv.style.display = 'none';
            errorDiv.innerText = '';

            if (!name) { showError('يرجى كتابة الاسم بشكل صحيح'); return; }
            if (!telegram.startsWith('@')) { showError('اكتب يوزرك ب الشكل الاتي مثال @mgpka باستخدام @'); return; }
            if (telegram.toLowerCase() === '@mgpka') { showError('هذا اليوزر غير مسموح باستخدامه'); return; }

            const number = parseInt(numberVal);
            if (isNaN(number) || number < 1 || number > 10) { 
                showError('يرجى اختيار رقم متاح من 1 إلى 10 عبر الضغط عليه'); 
                return; 
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري الحفظ...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, number, telegram })
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    closeFormModal();
                    document.getElementById('successModal').style.display = 'flex';
                    document.getElementById('playerName').value = '';
                    document.getElementById('playerNumber').value = '';
                    document.getElementById('playerTelegram').value = '';
                    fetchServerStatus();
                } else {
                    showError(result.message || 'الرقم محجوز اختر رقم اخر');
                }
            } catch (err) {
                showError('تعذر الاتصال بالسيرفر، تأكد من اتصال الإنترنت');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'تأكيد الحجز';
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById('formError');
            errorDiv.innerText = msg;
            errorDiv.style.display = 'block';
        }

        // 6. لوحة التحكم
        function openAdminLogin() { document.getElementById('adminLoginModal').style.display = 'flex'; }
        function closeAdminLogin() {
            document.getElementById('adminLoginModal').style.display = 'none';
            document.getElementById('adminError').style.display = 'none';
        }

        function loginAdmin() {
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPass').value.trim();
            if (email === 'alinael2018fa@gmail.com' && pass === 'alinael2018qwer') {
                closeAdminLogin();
                openAdminDashboard();
            } else {
                const err = document.getElementById('adminError');
                err.innerText = 'الإيميل أو كلمة السر غير صحيحة!';
                err.style.display = 'block';
            }
        }

        function openAdminDashboard() {
            document.getElementById('adminDashboardModal').style.display = 'flex';
            renderAdminTable();
        }

        function closeAdminDashboard() { document.getElementById('adminDashboardModal').style.display = 'none'; }

        async function renderAdminTable() {
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '<tr><td colspan="4">جاري تحميل القائمة من السيرفر...</td></tr>';

            try {
                const response = await fetch('/api/participants');
                currentParticipants = await response.json();

                tbody.innerHTML = '';
                if (!currentParticipants || currentParticipants.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">لا يوجد مشاركين مسجلين حالياً</td></tr>';
                    return;
                }

                currentParticipants.forEach((p, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${p.name}</td>
                        <td><b style="color:#d4af37;">${p.number}</b></td>
                        <td>${p.telegram}</td>
                        <td><button class="btn-delete" onclick="deleteParticipant(${index})">حذف</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="4">حدث خطأ أثناء جلب القائمة من السيرفر</td></tr>';
            }
        }

        async function deleteParticipant(index) {
            if (confirm('هل أنت متأكد من حذف هذا المشارك؟ سيتم إتاحة رقمه للجميع مجدداً.')) {
                try {
                    await fetch('/api/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ index })
                    });
                    renderAdminTable();
                    fetchServerStatus();
                } catch (err) {
                    alert('حدث خطأ أثناء الحذف من السيرفر');
                }
            }
        }

        // نسخ القائمة للتليجرام
        function copyListForTelegram() {
            if (!currentParticipants || currentParticipants.length === 0) {
                alert('لا يوجد مشاركين لنسخهم!');
                return;
            }
            let text = "🎩 *قائمة أعضاء مافيا الأمراء* 🔫\n\n";
            currentParticipants.forEach((p, i) => {
                text += `${i + 1}. [ ${p.name} ] - الرقم: (${p.number}) - ${p.telegram}\n`;
            });
            text += `\nالمجموع: ${currentParticipants.length} من 10 لاعبين.`;

            navigator.clipboard.writeText(text).then(() => {
                alert('تم نسخ قائمة المشاركين بنجاح! الصقها بالتليجرام مباشرة.');
            });
        }

        // تصفير الجولة
        async function resetRound() {
            if (confirm('⚠️ تحذير: هل أنت متأكد من تصفير كافة المشاركين وبدء جولة جديدة؟')) {
                await fetch('/api/reset', { method: 'POST' });
                renderAdminTable();
                fetchServerStatus();
                alert('تم تصفير المقاعد بنجاح.');
            }
        }
    </script>
</body>
</html>
